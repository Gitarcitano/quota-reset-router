name: Compatibility

# Builds the plugin and runs the host test against the latest CLIProxyAPI release.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  latest:
    name: latest CLIProxyAPI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET: linux_amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the latest CLIProxyAPI release
        id: cpa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$(gh release view --repo router-for-me/CLIProxyAPI --json tagName --jq .tagName)"
          version="${tag#v}"
          case "$version" in
            *[!0-9.]*|"") echo "unexpected release tag: $tag" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - env:
          CPA_VERSION: ${{ steps.cpa.outputs.version }}
        run: make build host-test TARGET=linux_amd64 CPA_VERSION="$CPA_VERSION"
      - name: Report the break
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.cpa.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          if [ -n "$VERSION" ]; then
            title="Compatibility break with CLIProxyAPI $VERSION"
            body="The host test failed against CLIProxyAPI $VERSION: $RUN_URL"
          else
            title="Compatibility check could not resolve the latest CLIProxyAPI release"
            body="The weekly compatibility check failed before the host test: $RUN_URL"
          fi
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
